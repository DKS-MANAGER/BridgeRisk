name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort
      - name: Lint with flake8
        run: flake8 src/ --max-line-length=100 --extend-ignore=E203,W503
      - name: Check formatting with black
        run: black --check src/
      - name: Check imports with isort
        run: isort --check-only --profile black src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run data preparation (uses pre-downloaded data if available)
        run: python src/prepare_data.py
      - name: Run model training
        run: python src/train_models.py
        timeout-minutes: 15
      - name: Run model evaluation
        run: python src/evaluate_models.py
      - name: Run SHAP explanation
        run: python src/explain_model.py
        timeout-minutes: 20
      - name: Run maintenance prioritization
        run: python src/prioritize_bridges.py
      - name: Validate pipeline
        run: |
          if grep -q "\[FAIL\]" reports/pipeline_validation.txt; then
            echo "Pipeline validation failed"
            exit 1
          fi
